<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Shop CRM</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell auth">
    <p class="eyebrow">Water filter shops</p>
    <h1>{{ title }}</h1>
    {% if error %}<p class="banner">{{ error }}</p>{% endif %}
    <form method="post" class="card">
      {% if mode == "setup" %}
      <label><span>Your name</span><input name="name" required autocomplete="name"></label>
      {% endif %}
      <label><span>Username</span><input name="username" required autocomplete="username" autocapitalize="none"></label>
      <label><span>Password</span><input name="password" type="password" required minlength="6" autocomplete="{% if mode == 'setup' %}new-password{% else %}current-password{% endif %}"></label>
      <button class="btn" type="submit">{% if mode == "setup" %}Create owner{% else %}Log in{% endif %}</button>
    </form>
    {% if mode == "setup" %}
    <p class="muted">This account can see every shop. You can add staff later.</p>
    {% endif %}
  </main>
</body>
</html>
