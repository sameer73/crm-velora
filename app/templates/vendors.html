{% extends "base.html" %}
{% block body %}
<form method="post" class="card">
  <label><span>Vendor name</span><input name="name" required></label>
  <label><span>Phone</span><input name="phone"></label>
  <label><span>Note</span><input name="note"></label>
  <button class="btn" type="submit">Add vendor</button>
</form>
<form method="get">
  <label><span>Search</span><input name="q" value="{{ q }}"></label>
</form>
{% for vendor in vendors %}
<div class="row">
  <span><strong>{{ vendor.name }}</strong><span class="muted">{{ vendor.phone }} {{ vendor.note }}</span></span>
</div>
{% else %}
<p class="empty">No vendors yet.</p>
{% endfor %}
{% endblock %}
