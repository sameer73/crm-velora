{% extends "base.html" %}
{% block body %}
{% if shop %}
<form method="post" class="card">
  <input type="hidden" name="shop_id" value="{{ shop.id }}">
  <label><span>Customer name</span><input name="name" required></label>
  <label><span>Phone</span><input name="phone"></label>
  <label><span>Address</span><textarea name="address"></textarea></label>
  <button class="btn" type="submit">Add customer</button>
</form>
{% else %}
<p class="card">Create a shop first.</p>
{% endif %}
<form method="get">
  <label><span>Search</span><input name="q" value="{{ q }}"></label>
</form>
{% for customer in customers %}
<div class="row">
  <span><strong>{{ customer.name }}</strong><span class="muted">{{ customer.phone }} {{ customer.address }}</span></span>
</div>
{% else %}
<p class="empty">No customers for this shop.</p>
{% endfor %}
{% endblock %}
