<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Shop CRM</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">{% if shop %}{{ shop.name }}{% else %}Shop books{% endif %}</p>
        <h1>{{ title }}</h1>
      </div>
      {% if shops %}
      <form method="post" action="/shop">
        <select class="shop" name="shop_id" aria-label="Shop" onchange="this.form.submit()">
          {% for s in shops %}
          <option value="{{ s.id }}" {% if shop and s.id == shop.id %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </form>
      {% endif %}
    </header>
    {% if error %}<p class="banner">{{ error }}</p>{% endif %}
    {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
    <main>
      {% block body %}{% endblock %}
    </main>
  </div>
  {% if shop %}
  <nav class="tabs">
    <a href="/" class="{% if nav == 'today' %}on{% endif %}">Today</a>
    <a href="/inventory" class="{% if nav == 'stock' %}on{% endif %}">Stock</a>
    <a href="/bills" class="{% if nav == 'bills' %}on{% endif %}">Bills</a>
    <a href="/wallet" class="{% if nav == 'cash' %}on{% endif %}">Cash</a>
    <a href="/more" class="{% if nav == 'more' %}on{% endif %}">More</a>
  </nav>
  {% endif %}
  <script src="/static/app.js"></script>
</body>
</html>
